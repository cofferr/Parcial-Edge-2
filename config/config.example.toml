# Copia a config/config.toml (fuera de git) y rellena las IP de la sesión.

[red]
gateway_ip = "192.168.43.1"   # puerta de enlace del hotspot

[esp32]
ip = "192.168.43.100"
distancia_m = 1.0
# Velocidad nominal del enlace. 72,2 Mbps es la cifra de la tabla MCS de 802.11n
# (HT20, MCS7, 1 flujo, guarda corta). La hoja técnica solo confirma "802.11n
# MCS0-7 en 20 y 40 MHz" y "hasta 150 Mbps". Cita final: pendiente.
velocidad_nominal_bps = 72_200_000
velocidad_nominal_fuente = "Tabla MCS IEEE 802.11n: HT20, MCS7, 1 flujo, guarda corta (cita pendiente)"

[droidcam]
ip = "192.168.43.1"
puerto = 4747
distancia_m = 1.0
# Sin velocidad nominal fija: se toma de tasa_transmision_mbps de la metadata de
# cada corrida (system_profiler, Mac), capturada al inicio y al cierre.
# URL de imagen fija para el extremo a extremo; vacío = abrir stream hasta primer fotograma.
url_imagen_fija = ""

[local]
indice_camara = 0
distancia_m = 0.0

[propagacion]
# Velocidad de propagación para d/v (aire: c; se usa c por ser enlace inalámbrico).
v_m_s = 299_792_458
