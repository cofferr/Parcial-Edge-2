# Copia a config/config.toml (fuera de git) y rellena las IP de la sesión.

[red]
gateway_ip = "192.168.43.1"   # puerta de enlace del hotspot

[esp32]
ip = "192.168.43.100"
distancia_m = 1.0
# Velocidad nominal del enlace. 72,2 Mbps es la cifra de la tabla MCS de 802.11n
# (HT20, MCS7, 1 flujo, guarda corta). La hoja técnica solo confirma "802.11n
# MCS0-7 en 20 y 40 MHz" y "hasta 150 Mbps". Cita final: pendiente.
velocidad_nominal_bps = 72_200_000
velocidad_nominal_fuente = "Tabla MCS IEEE 802.11n: HT20, MCS7, 1 flujo, guarda corta (cita pendiente)"

[droidcam]
ip = "192.168.43.1"
puerto = 4747
distancia_m = 1.0
# Sin velocidad nominal fija: se toma de tasa_transmision_mbps de la metadata de
# cada corrida (system_profiler, Mac), capturada al inicio y al cierre.
# URL de imagen fija para el extremo a extremo; vacío = abrir stream hasta primer fotograma.
url_imagen_fija = ""

[local]
indice_camara = 0
distancia_m = 0.0
# Resolución SOLICITADA a la cámara (nativa del MacBook Air M4). La real se registra
# aparte; si difiere, la fuente queda inválida. El FPS no se fuerza.
ancho = 1920
alto = 1080
jpeg_calidad = 50              # JPEG de referencia (solo tamaño y costo; fuera del e2e)

[propagacion]
# Velocidad de propagación para d/v (aire: c; se usa c por ser enlace inalámbrico).
v_m_s = 299_792_458

[lector]
# Parámetros del lector MJPEG de red (Paso 2).
backoff_inicial_s = 0.25       # espera tras el primer corte; se duplica en cada intento
backoff_max_s = 4.0
intentos_max = 5               # fallos seguidos antes de abandonar la fuente
cola_max = 8                   # cola lector -> decodificador (si se llena, se descarta)
recv_bytes = 65536             # tamaño del búfer de recv_into (64 KiB)
timeout_conexion_s = 3.0
timeout_inactividad_s = 5.0    # sin datos durante este tiempo = corte (o timeout en /capture)
warmup_fotogramas = 20
