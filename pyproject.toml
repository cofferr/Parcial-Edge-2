[project]
name = "edge-parcial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cofferr", email = "juanjo5411@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "setuptools<81",
]

[project.scripts]
edge-parcial = "edge_parcial:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "bleak>=3.0.2",
    "face-recognition>=1.3.0",
    "fastapi>=0.162.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# `uv run` incluye el grupo demo (panel, BLE, rostros) sin pasar --group.
default-groups = ["dev", "demo"]
